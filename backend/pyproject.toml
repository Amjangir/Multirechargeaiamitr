[project]
name = "rechargepro-backend"
version = "0.1.0"
description = "RechargePro multi-role recharge platform — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn==0.25.0",
    "motor==3.3.1",
    "pymongo==4.6.3",
    "pydantic>=2.6.4",
    "email-validator>=2.2.0",
    "pyjwt>=2.10.1",
    "bcrypt==4.1.3",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "tzdata>=2024.2",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false

